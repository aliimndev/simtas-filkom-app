# SIMTAS FILKOM — Monitoring stack (Prometheus + Grafana)
# Deploy on the same VPS as docker-compose.prod.yml so both share the
# simtas-network bridge and Prometheus can reach api:3001/metrics.
#
#   docker compose -f deploy/docker-compose.monitoring.yml up -d
#
# Grafana UI: http://<vps-ip>:3001  (default login: admin / change-me)
services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: simtas-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  grafana:
    image: grafana/grafana:11.3.1
    container_name: simtas-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - ../infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

volumes:
  prometheus_data:
  grafana_data:

networks:
  simtas-network:
    name: simtas-network
    external: true
