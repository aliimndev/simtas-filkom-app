# SIMTAS FILKOM — PostgreSQL production tuning (8 GB RAM VPS)
# File is included via postgres command: -c config_file=/etc/postgresql/postgresql.conf

# Memory (conservative for 8 GB RAM, leaving room for OS + other containers)
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB
effective_io_concurrency = 200
random_page_cost = 1.1

# Connections
max_connections = 200

# WAL / durability
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_writer_delay = 200ms

# Query planning
default_statistics_target = 100
jit = off

# Logging (production)
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p-%l] %q%u@%d '
log_timezone = 'Asia/Jakarta'
datestyle = 'iso, mdy'
timezone = 'Asia/Jakarta'
