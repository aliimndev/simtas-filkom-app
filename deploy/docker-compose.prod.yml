# SIMTAS FILKOM — Production deployment (single VPS)
# Target: 4 vCPU, 8 GB RAM, 150-200 GB SSD
#
# Deploy:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm backend ./simtas-api --migrate
#   docker compose -f docker-compose.prod.yml run --rm backend ./simtas-seed
#
# Requires: .env.production (see .env.production.example)

services:
  # ── PostgreSQL 16 (production tuned) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: simtas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-simtas_filkom}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    env_file: .env.production
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-simtas_filkom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'

  # ── PgBouncer (transaction pooling) ──────────────────────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: simtas-pgbouncer
    restart: always
    environment:
      - PGBOUNCER_DATABASE=simtas_filkom
      - PGBOUNCER_HOST=postgres
      - PGBOUNCER_PORT=5432
      - PGBOUNCER_USER=${DB_USER:-postgres}
      - PGBOUNCER_PASSWORD=${DB_PASSWORD}
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_DEFAULT_POOL_SIZE=25
      - PGBOUNCER_MAX_DB_CONNECTIONS=100
      - PGBOUNCER_MAX_CLIENT_CONN=100
      - PGBOUNCER_RESERVE_POOLING_TIME=30
      - PGBOUNCER_IDLE_IN_TRANSACTION_SESSION_TIMEOUT=300
      - PGBOUNCER_QUERY_TIMEOUT=120
      - PGBOUNCER_LOG_CONNECTIONS=1
      - PGBOUNCER_LOG_DISCONNECTIONS=1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  # ── Backend API (Go + Gin) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simtas-backend
    restart: always
    env_file: .env.production
    expose:
      - "8080"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1'

  # ── Frontend (Next.js standalone) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simtas-frontend
    restart: always
    expose:
      - "3000"
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ── Nginx (reverse proxy + SSL termination) ──────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: simtas-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/simtas.conf:/etc/nginx/conf.d/simtas.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  # ── MinIO (self-hosted S3-compatible storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: simtas-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
    volumes:
      - minio_data:/data
    networks:
      - simtas-network
    expose:
      - "9000"
      - "9001"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1'

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  simtas-network:
    driver: bridge
