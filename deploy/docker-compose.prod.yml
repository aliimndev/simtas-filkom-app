# SIMTAS FILKOM — Production deployment (Job 24)
# Deploy to VPS: /opt/simtas-filkom/docker-compose.prod.yml
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm backend ./simtas-api --migrate
#
# Requires a sibling .env.production file with the values from Job 24.

services:
  postgres:
    image: postgres:16-alpine
    container_name: simtas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simtas-network
    # Tidak expose port ke host — hanya internal network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPO}/simtas-backend:${IMAGE_TAG:-latest}
    container_name: simtas-backend
    restart: always
    env_file: .env.production
    ports:
      - "127.0.0.1:8080:8080" # hanya localhost — Nginx yang expose ke luar
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simtas-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  simtas-network:
    driver: bridge
