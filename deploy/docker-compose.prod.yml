# SIMTAS FILKOM — Production deployment (single VPS)
# The production stack uses Bun for both the Hono API and Svelte static server.
#
# Deploy:
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml logs -f api
#
# Requires: .env.production (see .env.production.example)

services:
  postgres:
    image: postgres:16-alpine
    container_name: simtas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-simtas_filkom}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    env_file: .env.production
    networks: [simtas-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-simtas_filkom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: simtas-pgbouncer
    restart: always
    environment:
      PGBOUNCER_DATABASE: ${DB_NAME:-simtas_filkom}
      PGBOUNCER_HOST: postgres
      PGBOUNCER_PORT: 5432
      PGBOUNCER_USER: ${DB_USER:-postgres}
      PGBOUNCER_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MAX_DB_CONNECTIONS: 100
      PGBOUNCER_MAX_CLIENT_CONN: 100
    depends_on:
      postgres:
        condition: service_healthy
    networks: [simtas-network]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: simtas-api
    restart: always
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME:-simtas_filkom}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://simtas.filkom.ac.id}
    expose: ["3001"]
    depends_on:
      pgbouncer:
        condition: service_started
    networks: [simtas-network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-}
    container_name: simtas-web
    restart: always
    expose: ["4173"]
    networks: [simtas-network]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  nginx:
    image: nginx:1.27-alpine
    container_name: simtas-nginx
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infrastructure/nginx/simtas.conf:/etc/nginx/conf.d/simtas.conf:ro
      - ../infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks: [simtas-network]

  minio:
    image: minio/minio:latest
    container_name: simtas-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - minio_data:/data
    networks: [simtas-network]
    expose: ["9000", "9001"]

volumes:
  postgres_data:
  minio_data:

networks:
  simtas-network:
    driver: bridge
