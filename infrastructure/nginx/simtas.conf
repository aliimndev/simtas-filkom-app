# SIMTAS FILKOM — Nginx reverse proxy config (Job 24)
# Deploy ke: /etc/nginx/sites-available/simtas.conf
# Enable: ln -s /etc/nginx/sites-available/simtas.conf /etc/nginx/sites-enabled/

# ── http context ──────────────────────────────────────────────────────
# limit_req_zone hanya valid di context http. Karena file ini di-include
# dari dalam blok http di nginx.conf, direktif diletakkan di level teratas.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Redirect HTTP ke HTTPS
server {
    listen 80;
    server_name api.simtas.filkom.unida.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.simtas.filkom.unida.ac.id;

    ssl_certificate     /etc/letsencrypt/live/api.simtas.filkom.unida.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.simtas.filkom.unida.ac.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Upload file size limit
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Rate limiting (zone didefinisikan di atas, gunakan di sini)
    limit_req zone=api burst=50 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
