name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Job 23: integration tests need a real PostgreSQL database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: simtas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: simtas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod download
      - run: gofmt -l .
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Job 23: integration tests (build tag) against the Postgres service.
      - name: Run integration tests
        run: go test ./internal/handler/... -tags integration -count=1
      # Job 23: coverage gate — the usecase layer must stay ≥ 80%.
      - name: Coverage gate (usecase ≥ 80%)
        run: make coverage-check
      # Job 22: fail if committed swagger docs are out of date with annotations
      # Pin the swag version so generated docs stay reproducible across CI runs.
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.4
      - name: Verify swagger docs are up to date
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          swag init -g cmd/server/main.go -o docs
          git diff --exit-code docs/ || (echo "Swagger docs are out of date. Run 'make docs' and commit the changes." && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # Job 23: component + smoke tests (jest, jsdom — no browser needed).
      - run: npm test -- --watchAll=false
      - run: npm run build