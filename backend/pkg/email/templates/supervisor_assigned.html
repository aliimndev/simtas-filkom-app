{{define "content"}}

{{if .Greeting}}<p style="margin:0 0 16px 0;font-size:14px;color:#4b5563;line-height:1.7;">{{.Greeting}}</p>{{end}}
{{if .Message}}<p style="margin:0 0 16px 0;font-size:14px;color:#4b5563;line-height:1.7;">{{.Message}}</p>{{end}}
{{template "detailTable" .}}

{{template "ctaButton" .}}
{{end}}
