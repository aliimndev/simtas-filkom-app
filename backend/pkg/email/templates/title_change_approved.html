{{define "content"}}
<h1 style="margin:0 0 12px 0;font-size:20px;color:#17191d;">Perubahan Judul Disetujui</h1>
{{if .Greeting}}<p style="margin:0 0 16px 0;font-size:14px;color:#4b5563;line-height:1.7;">{{.Greeting}}</p>{{end}}
{{if .Message}}<p style="margin:0 0 16px 0;font-size:14px;color:#4b5563;line-height:1.7;">{{.Message}}</p>{{end}}
{{template "statusBadge" .}}
{{template "detailTable" .}}
{{if .Notes}}<p style="margin:16px 0 0 0;font-size:13px;color:#7c8792;font-style:italic;">Catatan Pembimbing: {{.Notes}}</p>{{end}}
{{template "ctaButton" .}}
{{end}}
