                  $ref: '#/definitions/usecase.ConsultationDetail'
              type: object
        "404":
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Detail log bimbingan
      tags:
      - Supervision
    put:
      consumes:
      - application/json
      description: Memperbarui log konsultasi (pembuat log, selama status pending)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Consultation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data yang diperbarui
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.UpdateConsultationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Log diperbarui
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.ConsultationDetail'
              type: object
        "422":
          description: Log sudah di-approve
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update log bimbingan
      tags:
      - Supervision
  /theses/{thesis_id}/consultations/{id}/approve:
    patch:
      description: Menyetujui log konsultasi (Dosen Pembimbing thesis ini only)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Consultation ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Log disetujui
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.ConsultationDetail'
              type: object
        "403":
          description: Bukan pembimbing thesis ini
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Log sudah di-approve
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Setujui log bimbingan
      tags:
      - Supervision
  /theses/{thesis_id}/consultations/summary:
    get:
      description: Mengambil ringkasan statistik log konsultasi tanpa pagination
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ringkasan
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.ConsultationSummary'
              type: object
      security:
      - BearerAuth: []
      summary: Ringkasan bimbingan
      tags:
      - Supervision
  /theses/{thesis_id}/defenses:
    post:
      description: 'Mengajukan sidang skripsi (gate: seminar lulus + dokumen sidang
        approved) (Mahasiswa pemilik only)'
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Pengajuan dibuat
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.DefenseDetail'
              type: object
        "409":
          description: Sudah ada sidang aktif
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Gate belum terpenuhi
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Ajukan sidang skripsi
      tags:
      - Thesis Defense
  /theses/{thesis_id}/documents:
    get:
      description: Mengambil daftar dokumen aktif per tipe (pemilik/pembimbing/penguji/admin/kaprodi)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Filter tipe dokumen
        in: query
        name: document_type
        type: string
      - description: Filter status
        in: query
        name: status
        type: string
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Per halaman (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Daftar dokumen
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Daftar dokumen
      tags:
      - Documents
    post:
      consumes:
      - multipart/form-data
      description: Mengunggah dokumen PDF (Mahasiswa pemilik only)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: File PDF (max 10 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: Tipe dokumen (proposal, draft_chapter, seminar_doc, defense_doc,
          final_thesis, revision_sheet, endorsement_letter)
        in: formData
        name: document_type
        required: true
        type: string
      - description: Nomor bab 1-5 (wajib untuk draft_chapter)
        in: formData
        name: chapter_number
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Dokumen diunggah
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.DocumentDetail'
              type: object
        "400":
          description: File tidak valid
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Bukan pemilik thesis
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Upload dokumen
      tags:
      - Documents
  /theses/{thesis_id}/documents/{id}:
    get:
      description: Mengambil detail satu dokumen
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Document ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detail dokumen
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.DocumentDetail'
              type: object
        "404":
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Detail dokumen
      tags:
      - Documents
  /theses/{thesis_id}/documents/{id}/download:
    get:
      description: Menghasilkan presigned URL untuk download dokumen (expired 15 menit)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Document ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Presigned URL
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.DownloadResult'
              type: object
        "404":
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Download dokumen
      tags:
      - Documents
  /theses/{thesis_id}/documents/history:
    get:
      description: Mengambil semua versi dokumen untuk satu tipe (riwayat upload)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Tipe dokumen
        in: query
        name: document_type
        required: true
        type: string
      - description: Nomor bab (untuk draft_chapter)
        in: query
        name: chapter_number
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Riwayat versi
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Riwayat versi dokumen
      tags:
      - Documents
  /theses/{thesis_id}/graduation:
    put:
      consumes:
      - application/json
      description: Menetapkan thesis berstatus graduated (Kaprodi only)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Catatan yudisium (opsional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/usecase.GraduationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thesis berhasil dinyatakan lulus
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Prasyarat yudisium belum terpenuhi
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Tetapkan yudisium
      tags:
      - Thesis Defense
  /theses/{thesis_id}/review:
    put:
      consumes:
      - application/json
      description: Menyetujui atau menolak pengajuan judul (Kaprodi only)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Keputusan review
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.ReviewThesisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Hasil review
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.ThesisDetail'
              type: object
        "400":
          description: Decision tidak valid
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Status bukan submitted
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Review pengajuan judul
      tags:
      - Thesis Submission
  /theses/{thesis_id}/seminars:
    post:
      description: 'Mengajukan seminar proposal (gate: dokumen seminar approved) (Mahasiswa
        pemilik only)'
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Pengajuan dibuat
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.SeminarDetail'
              type: object
        "409":
          description: Sudah ada seminar aktif
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Gate belum terpenuhi
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Ajukan seminar proposal
      tags:
      - Seminar Proposal
  /theses/{thesis_id}/title-change-requests:
    get:
      description: Mengambil daftar permintaan perubahan judul sebuah thesis (pemilik,
        pembimbing, Kaprodi, Admin)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Daftar permintaan
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Akses ditolak
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Thesis tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Riwayat perubahan judul
      tags:
      - Title Change Request
    post:
      consumes:
      - application/json
      description: Mengajukan perubahan judul skripsi (Mahasiswa pemilik, thesis approved/in_progress
        dengan pembimbing)
      parameters:
      - description: Thesis ID (UUID)
        in: path
        name: thesis_id
        required: true
        type: string
      - description: Data perubahan judul
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateTitleChangeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Permintaan dibuat
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.TitleChangeRequestDetail'
              type: object
        "400":
          description: Validasi gagal
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Bukan pemilik thesis
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Thesis tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Sudah ada permintaan pending
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Ajukan perubahan judul
      tags:
      - Title Change Request
  /title-change-requests:
    get:
      description: Daftar permintaan perubahan judul PENDING untuk mahasiswa bimbingan
        (Dosen Pembimbing)
      produces:
      - application/json
      responses:
        "200":
          description: Antrian review
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Hanya Dosen Pembimbing
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Antrian review perubahan judul
      tags:
      - Title Change Request
  /title-change-requests/{id}/approve:
    post:
      consumes:
      - application/json
      description: Menyetujui permintaan perubahan judul (Dosen Pembimbing assigned;
        PENDING only) dan meng-update judul thesis secara atomik
      parameters:
      - description: Title change request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Catatan persetujuan (opsional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/usecase.ReviewTitleChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Permintaan disetujui
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.TitleChangeRequestDetail'
              type: object
        "400":
          description: Bukan status pending
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Bukan dosen pembimbing thesis ini
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Permintaan tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Setujui perubahan judul
      tags:
      - Title Change Request
  /title-change-requests/{id}/cancel:
    post:
      description: Membatalkan permintaan perubahan judul yang masih PENDING (Mahasiswa
        pemilik)
      parameters:
      - description: Title change request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Permintaan dibatalkan
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.TitleChangeRequestDetail'
              type: object
        "400":
          description: Bukan status pending
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Bukan pemilik permintaan
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Permintaan tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Batalkan permintaan perubahan judul
      tags:
      - Title Change Request
  /title-change-requests/{id}/reject:
    post:
      consumes:
      - application/json
      description: Menolak permintaan perubahan judul (Dosen Pembimbing assigned;
        PENDING only) dengan catatan wajib
      parameters:
      - description: Title change request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Alasan penolakan (wajib)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.ReviewTitleChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Permintaan ditolak
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/usecase.TitleChangeRequestDetail'
              type: object
        "400":
          description: Bukan status pending / catatan kosong
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Bukan dosen pembimbing thesis ini
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Permintaan tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Tolak perubahan judul
      tags:
      - Title Change Request
  /users/me/password:
    put:
      consumes:
      - application/json
      description: Mengganti password user yang sedang login
      parameters:
      - description: Password lama + baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil diubah
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Password saat ini salah / tidak memenuhi syarat
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Ganti password sendiri
      tags:
      - User Management
securityDefinitions:
  BearerAuth:
    description: 'Masukkan token dengan format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
