host: localhost:8080
info:
  contact:
    email: admin@filkom.unida.ac.id
    name: Admin SIMTAS FILKOM
  description: API untuk Sistem Manajemen Tugas Akhir dan Skripsi Fakultas Ilmu Komputer
    Universitas Djuanda.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://filkom.unida.ac.id
  title: SIMTAS FILKOM API
  version: 1.1.0
paths:
  /academic-years:
    get:
      description: Mengambil semua tahun akademik (semua user terautentikasi)
      produces:
      - application/json
      responses:
        "200":
          description: Daftar tahun akademik
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Daftar tahun akademik
      tags:
      - Academic Years
    post:
      consumes:
      - application/json
      description: Membuat tahun akademik baru (Admin only)
      parameters:
      - description: Data tahun akademik
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.AcademicYearRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tahun akademik dibuat
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Buat tahun akademik
      tags:
      - Academic Years
  /academic-years/{id}:
    put:
      consumes:
      - application/json
      description: Memperbarui data tahun akademik (Admin only)
      parameters:
      - description: Tahun akademik ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data yang diperbarui
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.AcademicYearRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tahun akademik diperbarui
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Tidak dapat diubah (aktif dengan skripsi berjalan)
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update tahun akademik
      tags:
      - Academic Years
  /academic-years/{id}/activate:
    patch:
      description: Mengaktifkan tahun akademik (menonaktifkan yang lain) (Admin only)
      parameters:
      - description: Tahun akademik ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tahun akademik berhasil diaktifkan
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Tidak ditemukan
